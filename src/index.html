    <script>
      // Theme vor dem ersten Rendern setzen, um einen Farbschema-Flash zu vermeiden.
      (function () {
        try {
          var stored = localStorage.getItem('ea-portfolio-theme');
          var dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
